name: Release

on:
  push:
    tags:
      - "v*"
  # On-demand releases: run the workflow by hand against a tag or branch.
  workflow_dispatch:

permissions:
  contents: write # required to create the GitHub Release and upload assets

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Tests gate the release: a failure here aborts before anything is built
      # or published, so a broken commit can never ship.
      - name: Test
        run: make test

      # Strip the leading `v` so the tag `v1.3.0` embeds the version `1.3.0`.
      # workflow_dispatch runs carry no tag; fall back to the ref name so a
      # manual release still produces a labelled build instead of an empty one.
      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Shared cross-compile step (see cross-compile-all-platforms): one target
      # produces every googledrive-mcp-<goos>-<goarch> asset with the version baked in.
      - name: Build all platforms
        run: make build-all VERSION="${{ steps.version.outputs.version }}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true # no assets to upload is a hard failure
