[project]
site_name = "Google Drive MCP"
site_description = "A Go MCP server that exposes Google Drive, Docs, and Sheets operations as tools"
docs_dir = "."
nav = [
  { "Home" = "index.md" },
  { "Getting Started" = "getting-started.md" },
  { "Setup" = [
    "setup/google-cloud.md",
    "setup/installation.md",
    "setup/configuration.md",
    "setup/mcp-clients.md",
  ]},
  { "Tools Reference" = [
    "tools/drive.md",
    "tools/sheets.md",
    "tools/docs.md",
  ]},
]

[project.theme]
features = [
  "navigation.instant",
  "navigation.sections",
  "navigation.expand",
  "navigation.top",
  "navigation.path",
  "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
primary = "blue"
accent = "blue"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "blue"
accent = "blue"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"
